<svg role="img" xmlns="http://www.w3.org/2000/svg" width="500" height="340" viewBox="0 0 500 340" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Tres cartas de póker</title>
  <rect width="500" height="340" fill="#333333"/>
  <g transform="translate(250 170) scale(0.78) translate(-250 -170)">
  <g transform="rotate(-18 170 180)">
    <rect x="110" y="60" width="120" height="180" rx="12" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <text x="125" y="95" font-size="26" font-weight="bold" fill="#d4af37">Q</text>
    <text x="125" y="125" font-size="24" fill="#d4af37">&#9829;</text>
    <text x="190" y="205" font-size="60" text-anchor="middle" fill="#d4af37">&#9829;</text>
  </g>
  <g transform="rotate(0 250 180)">
    <rect x="190" y="50" width="120" height="180" rx="12" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <text x="205" y="85" font-size="26" font-weight="bold" fill="#000000">K</text>
    <text x="205" y="115" font-size="24" fill="#000000">&#9824;</text>
    <text x="250" y="195" font-size="64" text-anchor="middle" fill="#000000">&#9824;</text>
  </g>
  <g transform="rotate(18 330 180)">
    <rect x="270" y="60" width="120" height="180" rx="12" fill="#ffffff" stroke="#333333" stroke-width="3"/>
    <text x="285" y="95" font-size="26" font-weight="bold" fill="#333333">A</text>
    <text x="285" y="125" font-size="24" fill="#333333">&#9830;</text>
    <text x="330" y="205" font-size="60" text-anchor="middle" fill="#333333">&#9830;</text>
  </g>
  </g>
</svg>
